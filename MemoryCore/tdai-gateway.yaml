deployMode: standalone
stateBackend: local

server:
  port: 8420
  host: 127.0.0.1

data:
  baseDir: /opt/tencent-mem/data/tdai-memory

llm:
  baseUrl: https://api.stepfun.com/v1
  apiKey: ""  # 实际 key 走环境变量（见 hub.env）
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  maxTokens: 32000
  timeoutMs: 300000

memory:
  promptMode: chat
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    enabled: true
    provider: openai
    baseUrl: https://api.siliconflow.cn/v1
    apiKey: ""  # 实际 key 走环境变量（见 hub.env）
    model: Qwen/Qwen3-Embedding-4B
    dimensions: 2560

skill:
  enabled: true
  routing:
    mode: bm25
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000

knowledge:
  enabled: true
